<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Federated SOC Intelligence Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/soc.css">
</head>
<body style="display:flex;">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h2>FedSOC Platform</h2>
            <p class="login-sub">Federated Threat Intelligence — Secure Access</p>

            {% if messages %}
            {% for message in messages %}
            <div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:0.8rem;color:var(--accent-red);">
                <i class="bi bi-exclamation-triangle-fill"></i> {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'users:login' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" class="form-control-soc" placeholder="Enter username" autofocus required>
                </div>
                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" class="form-control-soc" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-login" id="btn-login">
                    <i class="bi bi-box-arrow-in-right"></i> Authenticate
                </button>
            </form>

            <div style="text-align:center;margin-top:20px;font-size:0.7rem;color:var(--text-muted);">
                Authorized personnel only. All access is logged and monitored.
            </div>
        </div>
    </div>
</body>
</html>
